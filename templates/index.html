<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Perros y Gatos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="titulo">Clasificador de Perros y Gatos</h1>
        <form action="/predict" method="POST" enctype="multipart/form-data" class="formulario">
            <label for="file">Selecciona una imagen:</label>
            <input type="file" name="file" id="file" accept="image/*" required>
            <button type="submit">Clasificar Imagen</button>
        </form>
    </div>
</body>
</html>
